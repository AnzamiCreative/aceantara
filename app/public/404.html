<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>404 — ACEANTARA</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f2faf4;
        color: #10281b;
        font-family: 'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif;
        text-align: center;
        padding: 24px;
      }
      main { max-width: 28rem; }
      img { width: 72px; height: 72px; border-radius: 16px; margin-bottom: 24px; }
      .code {
        font-family: ui-monospace, monospace;
        font-size: 0.75rem;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: #2e7d4f;
        margin-bottom: 12px;
      }
      h1 { font-size: 1.75rem; font-weight: 800; letter-spacing: -0.02em; }
      .en { margin-top: 8px; font-size: 0.95rem; color: #5b7266; }
      .desc { margin-top: 16px; font-size: 0.95rem; line-height: 1.7; color: #5b7266; }
      a {
        display: inline-flex;
        margin-top: 28px;
        height: 44px;
        align-items: center;
        padding: 0 24px;
        border-radius: 999px;
        background: #1f5c3a;
        color: #fff;
        font-size: 0.9375rem;
        font-weight: 600;
        text-decoration: none;
        transition: background 0.2s ease, transform 0.2s ease;
      }
      a:hover { background: #17492e; transform: translateY(-1px); }
    </style>
  </head>
  <body>
    <main>
      <img src="/apple-touch-icon.png" alt="ACEANTARA" />
      <p class="code">Error 404</p>
      <h1>Halaman tidak ditemukan</h1>
      <p class="en">The page you are looking for doesn't exist or has moved.</p>
      <p class="desc">
        Coba kembali ke beranda, atau langsung chat kami lewat WhatsApp —
        konsultasi gratis, tanpa kewajiban lanjut.
      </p>
      <a href="/">← Kembali ke beranda</a>
    </main>
  </body>
</html>
