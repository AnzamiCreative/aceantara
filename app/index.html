    <!-- Terapkan tema tersimpan sebelum React dimuat supaya tidak ada kedip terang -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('ace-theme');
          if (t !== 'light' && t !== 'dark') {
            t = window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
          }
          var root = document.documentElement;
          root.classList.toggle('dark', t === 'dark');
          root.style.colorScheme = t;
          if (t === 'dark') {
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', '#0A1811');
          }
        } catch (e) {
          /* localStorage tidak tersedia — abaikan */
        }
      })();
    </script>
    <link rel="preload" as="font" type="font/woff2" href="/fonts/PlusJakartaSans-latin.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/JetBrainsMono-latin.woff2" crossorigin />
